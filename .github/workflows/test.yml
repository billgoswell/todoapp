name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # CLI Tests
  cli-tests:
    name: CLI Tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'todo-cmdline/go.sum'

      - name: Run CLI tests
        working-directory: todo-cmdline
        run: |
          go clean -testcache
          go test ./cmd/app -v -race -coverprofile=coverage.out

      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./todo-cmdline/coverage.out
          flags: cli
          name: cli-coverage
          fail_ci_if_error: false

  # Server Tests
  server-tests:
    name: Server Tests (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commandlinetodo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'todo-server/go.sum'

      - name: Run server tests
        working-directory: todo-server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: commandlinetodo_test
          TEST_USE_LOCAL_SERVER: 'true'
        run: |
          go clean -testcache
          go test ./... -v -race -coverprofile=coverage.out

      - name: Upload server coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./todo-server/coverage.out
          flags: server
          name: server-coverage
          fail_ci_if_error: false

  # Mobile Tests
  mobile-tests:
    name: Mobile Tests (React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'todo-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: todo-mobile
        run: npm install

      - name: Run mobile tests
        working-directory: todo-mobile
        run: npm test -- --coverage --watchAll=false --maxWorkers=2

      - name: Upload mobile coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./todo-mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage
          fail_ci_if_error: false

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [cli-tests, server-tests, mobile-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary"
          echo ""
          echo "✅ CLI Tests: ${{ needs.cli-tests.result }}"
          echo "✅ Server Tests: ${{ needs.server-tests.result }}"
          echo "✅ Mobile Tests: ${{ needs.mobile-tests.result }}"

      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const cliResult = '${{ needs.cli-tests.result }}';
            const serverResult = '${{ needs.server-tests.result }}';
            const mobileResult = '${{ needs.mobile-tests.result }}';

            const emoji = (result) => result === 'success' ? '✅' : '❌';

            const comment = `## Test Results
${emoji(cliResult)} CLI Tests
${emoji(serverResult)} Server Tests
${emoji(mobileResult)} Mobile Tests

📊 Coverage reports available on [Codecov](https://codecov.io)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
