name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build CLI
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'todo-cmdline/go.sum'

      - name: Build CLI (Linux)
        working-directory: todo-cmdline
        run: |
          mkdir -p ../releases
          go build -v -o ../releases/cli ./cmd/app

      - name: Build CLI (macOS)
        working-directory: todo-cmdline
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -v -o ../releases/cli-darwin-amd64 ./cmd/app

      - name: Build CLI (Windows)
        working-directory: todo-cmdline
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v -o ../releases/cli-windows-amd64.exe ./cmd/app

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cli-binaries
          path: releases/cli*
          retention-days: 5

  # Build Server
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: 'todo-server/go.sum'

      - name: Build server
        working-directory: todo-server
        run: |
          mkdir -p ../releases
          go build -v -o ../releases/server ./cmd/server

      - name: Upload server artifact
        uses: actions/upload-artifact@v3
        with:
          name: server-binary
          path: releases/server
          retention-days: 5

  # Build Docker Image
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''

      - name: Extract version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${{ secrets.DOCKER_USERNAME }}/commandlinetodo-server" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./todo-server
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: secrets.DOCKER_USERNAME != ''

      - name: Docker build (dry run)
        uses: docker/build-push-action@v4
        with:
          context: ./todo-server
          push: false
          tags: commandlinetodo-server:test
        if: secrets.DOCKER_USERNAME == ''

  # Build Mobile
  build-mobile:
    name: Build Mobile App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'todo-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: todo-mobile
        run: npm install

      - name: Check TypeScript
        working-directory: todo-mobile
        continue-on-error: true
        run: npm run type-check

      - name: Validate Expo config
        working-directory: todo-mobile
        run: |
          npm list expo || true
          cat app.json

  # Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, build-server, build-mobile]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cli-binaries/cli*
            server-binary/server
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
