name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  # Go Linting
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=10m --max-issues-per-linter=0
          working-directory: './todo-cmdline'

      - name: golangci-lint (server)
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=10m --max-issues-per-linter=0
          working-directory: './todo-server'

  # Go Security
  go-security:
    name: Go Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gosec Security Scanner (CLI)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-cli.sarif ./todo-cmdline/...'
        continue-on-error: true

      - name: Run Gosec Security Scanner (Server)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-server.sarif ./todo-server/...'
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: gosec-*.sarif
        continue-on-error: true

  # TypeScript Linting
  typescript-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'todo-mobile/package-lock.json'

      - name: Install dependencies
        working-directory: todo-mobile
        run: npm install

      - name: Run ESLint
        working-directory: todo-mobile
        continue-on-error: true
        run: npm run lint 2>&1 | tee eslint-report.txt || true

      - name: Run TypeScript check
        working-directory: todo-mobile
        continue-on-error: true
        run: npm run type-check 2>&1 | tee typescript-report.txt || true

  # Dependency Check
  dependency-check:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check npm dependencies (Mobile)
        working-directory: todo-mobile
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Check Go dependencies (CLI)
        working-directory: todo-cmdline
        continue-on-error: true
        run: go list -u -m -json all | go run github.com/sonatype-nexus-community/nancy@latest sleuth -o markdown

      - name: Check Go dependencies (Server)
        working-directory: todo-server
        continue-on-error: true
        run: go list -u -m -json all | go run github.com/sonatype-nexus-community/nancy@latest sleuth -o markdown

  # Code Quality Summary
  quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [go-lint, go-security, typescript-lint, dependency-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Code Quality Results"
          echo ""
          echo "✅ Go Linting: ${{ needs.go-lint.result }}"
          echo "✅ Go Security: ${{ needs.go-security.result }}"
          echo "✅ TypeScript Linting: ${{ needs.typescript-lint.result }}"
          echo "✅ Dependency Check: ${{ needs.dependency-check.result }}"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const goLintResult = '${{ needs.go-lint.result }}';
            const goSecResult = '${{ needs.go-security.result }}';
            const tsLintResult = '${{ needs.typescript-lint.result }}';
            const depResult = '${{ needs.dependency-check.result }}';

            const emoji = (result) => result === 'success' ? '✅' : '⚠️';

            const comment = `## Code Quality Check Results

${emoji(goLintResult)} Go Linting
${emoji(goSecResult)} Go Security Scanning
${emoji(tsLintResult)} TypeScript Linting
${emoji(depResult)} Dependency Vulnerabilities`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
