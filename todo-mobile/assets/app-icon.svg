<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051D5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F4FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background with rounded corners -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGradient)" />

  <!-- Checkmark circle background -->
  <circle cx="512" cy="512" r="380" fill="url(#iconGradient)" opacity="0.1" />

  <!-- Main checkmark -->
  <g transform="translate(512, 512)">
    <!-- Checkmark path -->
    <path
      d="M -150 -50 L -50 50 L 150 -100"
      stroke="white"
      stroke-width="80"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      filter="drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15))"
    />
  </g>

  <!-- Accent circle (bottom right) -->
  <circle cx="800" cy="800" r="60" fill="white" opacity="0.2" />
  <circle cx="850" cy="850" r="30" fill="white" opacity="0.3" />

  <!-- Subtle grid pattern (optional detail) -->
  <g opacity="0.05" stroke="white" stroke-width="2">
    <line x1="200" y1="0" x2="200" y2="1024" />
    <line x1="400" y1="0" x2="400" y2="1024" />
    <line x1="600" y1="0" x2="600" y2="1024" />
    <line x1="800" y1="0" x2="800" y2="1024" />
    <line x1="0" y1="200" x2="1024" y2="200" />
    <line x1="0" y1="400" x2="1024" y2="400" />
    <line x1="0" y1="600" x2="1024" y2="600" />
    <line x1="0" y1="800" x2="1024" y2="800" />
  </g>
</svg>
